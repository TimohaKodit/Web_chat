<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Chat</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 16px;
            background: #f7f7f8;
            color: #1a1a1a;
        }
        h1 { font-size: 20px; margin: 0 0 16px; }
        #status { font-size: 13px; color: #888; margin-bottom: 12px; }

        #messages {
            list-style: none;
            margin: 0 0 16px;
            padding: 12px;
            height: 380px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        #messages li { padding: 4px 0; word-wrap: break-word; }
        #messages li.system { color: #888; font-style: italic; font-size: 13px; }
        #messages li .author { font-weight: 600; margin-right: 6px; }

        form { display: flex; gap: 8px; }
        input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #2b6cb0;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled { background: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Web Chat</h1>

    <!-- Экран 1: ввод имени. Виден при загрузке. -->
    <form id="loginForm">
        <input type="text" id="usernameInput" autocomplete="off"
               placeholder="Ваше имя" maxlength="32" required autofocus />
        <button type="submit">Войти</button>
    </form>

    <!-- Экран 2: чат. Скрыт, пока не введено имя. -->
    <div id="chat" hidden>
        <div id="status">Подключение...</div>
        <ul id="messages"></ul>
        <form id="chatForm">
            <input type="text" id="messageText" autocomplete="off" placeholder="Сообщение..." />
            <button type="submit" id="sendButton" disabled>Отправить</button>
        </form>
    </div>

    <script>
        // --- Элементы страницы ---
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("usernameInput");
        const chat = document.getElementById("chat");
        const status = document.getElementById("status");
        const messages = document.getElementById("messages");
        const chatForm = document.getElementById("chatForm");
        const messageInput = document.getElementById("messageText");
        const sendButton = document.getElementById("sendButton");

        let ws = null;  // сокет появится только после ввода имени

        // --- Экран 1: пользователь ввёл имя ---
        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const username = usernameInput.value.trim();
            if (!username) return;

            loginForm.hidden = true;   // спрятать форму имени
            chat.hidden = false;       // показать чат
            connect(username);
        });

        // --- Открыть сокет и представиться ---
        function connect(username) {
            ws = new WebSocket(`ws://${location.host}/ws`);

            ws.onopen = () => {
                // Первое сообщение — по протоколу — имя пользователя
                ws.send(JSON.stringify({ user: username }));
                status.textContent = `Подключено как ${username}`;
                sendButton.disabled = false;
                messageInput.focus();
            };

            ws.onclose = () => {
                status.textContent = "Соединение закрыто";
                sendButton.disabled = true;
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                render(data);
            };
        }

        // --- Нарисовать одно входящее сообщение ---
        function render(data) {
            const item = document.createElement("li");

            if (data.type === "system") {
                item.className = "system";
                item.textContent = data.text;
            } else {
                const author = document.createElement("span");
                author.className = "author";
                author.textContent = data.user + ":";
                item.appendChild(author);
                item.appendChild(document.createTextNode(data.text));
            }

            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

        // --- Экран 2: пользователь отправил сообщение ---
        chatForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            ws.send(JSON.stringify({ text: text }));
            messageInput.value = "";
        });
    </script>
</body>
</html>
